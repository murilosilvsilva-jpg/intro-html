<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site sobre elemento Iframe. Inline Frame para embutir outros sites.">
    <title>Sobre IFrame  | HTML </title>
</head>
<body>
    <h1>Iframe</h1>
    <hr>

    <h2>Para que serve?</h2>
    <p> O Inline Frame (IFrame) é um elemento que nos permite embutir outro documento ou conteúdo externo dentro da nossa página. É bastante usado para YouTube, Google Maps, formulários externos e etc. </p>    

    <h3>Exemplo básico de iframe</h3>
    <iframe src="04-imagens.html" frameborder="0"></iframe>

    <hr>
    <h3>Carregando o YouTube</h3>
    <iframe 
    width="860" 
    height="515" 
    src="https://www.youtube.com/embed/qMNX3FJh4Z4?si=ko1jpBGJLZr-RftL" title="YouTube video player com o video do Rap do Curinga" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" 
    allowfullscreen></iframe>

    <hr>
    <h3>Carregando maps </h3>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14618.032462188043!2d-46.73361915325927!3d-23.657780461017907!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce5181d0dae023%3A0x9ad526a77fe4173a!2sS%C3%A3o%20Luiz%20-%20Jardim%20Leticia%2C%20S%C3%A3o%20Paulo%20-%20SP%2C%2005846-380!5e0!3m2!1spt-BR!2sbr!4v1790166518753!5m2!1spt-BR!2sbr" 
    width="600" 
    height="450" 
    style="border:0;" 
    allowfullscreen="" 
    loading="lazy" 
    referrerpolicy="strict-origin-when-cross-origin"></iframe>



</body>
</html>
