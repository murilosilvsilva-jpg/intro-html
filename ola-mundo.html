<!-- DOCTYPE - serve para indicar para os navegadores  -->
<!DOCTYPE html>
<!--  HTML - Elemento raiz. Tudo que pertence ao documento HTML fica dentro dele -->

<!-- LANG/language(idioma) -->
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <!-- Responsavel pela responsividade do site -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Titulo = O que aparecerá no -->
        <title>Olá Mundo</title>
    </head>

    <!--  -->
    <body>
        <h1>Olá, mundo! Este é o meu primeiro programa em HTML.</h1>
    </body>
</html>
